<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f3ebd7">
    <meta name="robots" content="noindex">
    <title>Página no encontrada | Lucian Rodríguez Plasencia</title>
    <link rel="icon" href="/favicon.ico" sizes="32x32">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="not-found section-wrap" id="contenido">
      <div class="not-found__copy">
        <p class="eyebrow">Error 404</p>
        <h1>Esta página <em>no existe.</em></h1>
        <p>Un bug 404 se la llevó por delante. Es posible que el enlace haya cambiado o que la dirección tenga un error.</p>
        <p lang="en">This page could not be found. · <span lang="pt">Esta página não foi encontrada.</span></p>
        <div class="hero__actions">
          <a class="button button--dark" href="/">
            <span>Volver al inicio</span> <span aria-hidden="true">←</span>
          </a>
          <a class="button button--outline" href="/en/" lang="en">
            <span>English</span>
          </a>
          <a class="button button--outline" href="/pt/" lang="pt">
            <span>Português</span>
          </a>
        </div>
      </div>

      <figure class="not-found__media">
        <picture>
          <source media="(prefers-reduced-motion: reduce)" srcset="/assets/404-chase-still.jpg">
          <source type="image/webp" srcset="/assets/404-chase.webp">
          <img
            src="/assets/404-chase.gif"
            width="720"
            height="402"
            alt="Animación en pixel art: un bloque naranja con el texto 404 persigue a un desarrollador asustado por una oficina llena de monitores; cuando casi lo alcanza, el letrero de neón «Error 404» falla y los papeles salen volando."
            decoding="async"
          >
        </picture>
        <figcaption>El bug 404 casi lo alcanza. La página, en cambio, sigue sin aparecer.</figcaption>
      </figure>
    </main>
  </body>
</html>
